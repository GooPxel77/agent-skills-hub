<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-label="Agent Skills Hub" role="img">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ashBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#140f2d" />
      <stop offset="100%" stop-color="#05040a" />
    </radialGradient>

    <!-- Purple Neon Circuit Gradient -->
    <linearGradient id="ashSGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Warm Gradient for Center Branch -->
    <linearGradient id="ashWarmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="80%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Concentric Amber Node Core -->
    <radialGradient id="ashAmberCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="ashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ashAmberGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Tech Base -->
  <rect width="128" height="128" rx="28" fill="url(#ashBg)" />

  <!-- Ambient Glow Behind Circuit -->
  <g opacity="0.65" filter="url(#ashGlow)">
    <path d="M 42 26 L 68 26 L 82 46 L 70 58 L 44 58 L 32 70 L 44 88 L 70 88 L 82 72" 
          stroke="url(#ashSGrad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sharp Main S Circuit -->
  <g filter="url(#ashGlow)">
    <path d="M 42 26 L 68 26 L 82 46 L 70 58 L 44 58 L 32 70 L 44 88 L 70 88 L 82 72" 
          stroke="url(#ashSGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Top Branch to Purple Rounded Node -->
    <path d="M 80 43 Q 88 43 93 38 Q 98 34 104 34" 
          stroke="#a855f7" stroke-width="6" stroke-linecap="round" fill="none" />
    <rect x="98" y="28" width="13" height="13" rx="3.5" fill="#2e1065" stroke="#c084fc" stroke-width="2.5" />

    <!-- Bottom Branch to Purple Rounded Node -->
    <path d="M 80 74 Q 88 74 93 79 Q 98 84 104 84" 
          stroke="#a855f7" stroke-width="6" stroke-linecap="round" fill="none" />
    <rect x="98" y="78" width="13" height="13" rx="3.5" fill="#2e1065" stroke="#c084fc" stroke-width="2.5" />

    <!-- Middle Connector to Glowing Concentric Node -->
    <line x1="64" y1="58" x2="92" y2="58" stroke="url(#ashWarmGrad)" stroke-width="6.5" stroke-linecap="round" />
  </g>

  <!-- Concentric Golden Node with Warm Radiant Bloom -->
  <g filter="url(#ashAmberGlow)">
    <!-- Outer Radiant Ring -->
    <circle cx="100" cy="58" r="11" stroke="#fbbf24" stroke-width="3.5" fill="none" />
    <!-- Inner Radiant Core -->
    <circle cx="100" cy="58" r="5.5" fill="url(#ashAmberCore)" />
  </g>
</svg>