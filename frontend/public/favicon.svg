<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-label="Agent Skills Hub" role="img">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="favSGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="40%" stop-color="#7c3aed" />
      <stop offset="75%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="favWarmGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="35%" stop-color="#e11d48" />
      <stop offset="75%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="favAmberCoreLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>

    <!-- Dark Mode Gradients -->
    <linearGradient id="favSGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="favWarmGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#fb7185" />
      <stop offset="75%" stop-color="#fbbf24" />
    </linearGradient>

    <radialGradient id="favAmberCoreDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>
  </defs>

  <style>
    /* Default / Light Mode: Crisp & High Contrast on white/light tabs */
    .s-tube {
      stroke: url(#favSGradLight);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .branch-path {
      stroke: #7c3aed;
      stroke-width: 6;
      stroke-linecap: round;
      fill: none;
    }
    .connector-line {
      stroke: url(#favWarmGradLight);
      stroke-width: 6.5;
      stroke-linecap: round;
    }
    .terminal-box {
      fill: #ede9fe;
      stroke: #7c3aed;
      stroke-width: 2.2;
    }
    .amber-outer {
      stroke: #d97706;
      stroke-width: 3.5;
      fill: #fffbeb;
    }
    .amber-inner {
      fill: url(#favAmberCoreLight);
    }

    /* Dark Mode: Radiant Neon & Bloom for dark tabs */
    @media (prefers-color-scheme: dark) {
      .s-tube {
        stroke: url(#favSGradDark);
        filter: drop-shadow(0 0 3px rgba(192, 132, 252, 0.65));
      }
      .branch-path {
        stroke: #c084fc;
      }
      .connector-line {
        stroke: url(#favWarmGradDark);
      }
      .terminal-box {
        fill: #2e1065;
        stroke: #c084fc;
        stroke-width: 2;
      }
      .amber-outer {
        stroke: #fbbf24;
        fill: #1c1917;
        filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.85));
      }
      .amber-inner {
        fill: url(#favAmberCoreDark);
      }
    }
  </style>

  <!-- NO background rectangle: 100% transparent -->

  <!-- Main S Circuit Tube -->
  <path
    class="s-tube"
    d="M 24 82 L 38 102 L 61 102 L 74 82 L 61 64 L 38 64 L 24 46 L 38 26 L 61 26"
  />

  <!-- Top Branch to Node -->
  <path
    class="branch-path"
    d="M 61 26 L 74 46 C 79 51, 84 42, 93 42"
  />
  <rect class="terminal-box" x="93" y="35" width="14" height="14" rx="3.5" />

  <!-- Bottom Branch to Node -->
  <path
    class="branch-path"
    d="M 74 82 C 79 82, 84 88, 93 88"
  />
  <rect class="terminal-box" x="93" y="81" width="14" height="14" rx="3.5" />

  <!-- Center Warm Connector -->
  <line class="connector-line" x1="61" y1="64" x2="89" y2="64" />

  <!-- Amber Concentric Node -->
  <circle class="amber-outer" cx="100" cy="64" r="10" />
  <circle class="amber-inner" cx="100" cy="64" r="5" />
</svg>