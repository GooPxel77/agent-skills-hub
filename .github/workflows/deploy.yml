name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Sync Skills Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore last successful public snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=catalog-snapshot-v1&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            mkdir -p .cache-dl
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name catalog-snapshot-v1 --dir .cache-dl
            mkdir -p .cache
            find .cache-dl -name "catalog-snapshot.json" -exec cp -f {} .cache/catalog-snapshot.json \;
            rm -rf .cache-dl
            echo "Restored snapshot file:"
            ls -lh .cache/catalog-snapshot.json || true
          fi

      - name: Export catalog only when data changes
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ] && [ -f .cache/catalog-snapshot.json ]; then
            CATALOG_REUSE_SNAPSHOT=1 npm run export:catalog
          elif ! npm run export:catalog; then
            if [ -f .cache/catalog-snapshot.json ]; then
              echo "Export failed; falling back to existing snapshot"
              CATALOG_REUSE_SNAPSHOT=1 npm run export:catalog
            else
              echo "First export failed and no cached snapshot exists. Check VITE_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets."
              exit 1
            fi
          fi

      - name: Build from the validated snapshot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.CATALOG_API_BASE_URL }}
          CATALOG_REUSE_SNAPSHOT: '1'
        run: npm run build

      - name: Save public snapshot for future code-only builds
        uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot-v1
          path: frontend/.cache/catalog-snapshot.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Search engine notification removed for personal use
